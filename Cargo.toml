[package]
name = "hft"
version = "0.1.0"
edition = "2021"

[dependencies]
solana-sdk = "^2"
solana-client = "^2"
solana-program = "^2"
spl-token = "7.0"
spl-associated-token-account = "6.0"
tokio = { version = "1.43", features = ["full"] }
anyhow = "1.0"
base58 = "0.2"
bytemuck = "1.21"
futures = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
struct-field-names-as-array = "0.3"
thiserror = "2.0"
tungstenite = { version = "0.26", features = ["native-tls"] }
url = "2.5"
bincode = "1.3"
clap = { version = "4.5", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
tokio-tungstenite = { version = "0.26", features = ["native-tls"] }
base64 = "0.22"
lazy_static = "1.5"
uuid = { version = "1.13", features = ["v4", "serde"] }
colored = "3.0"
zmq = "0.10"
zmq-sys = "0.12"
sqlx = { version = "0.8.3", features = ["runtime-tokio", "tls-native-tls", "postgres", "chrono", "uuid", "json", "macros"], default-features = false }
dotenv = "0.15"

[[bin]]
name = "detector"
path = "src/bin/detector.rs"

[[bin]]
name = "trader"
path = "src/bin/trader.rs" 

[[bin]]
name = "analyze"
path = "src/bin/analyze.rs"